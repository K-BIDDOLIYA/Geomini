<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#191c24;color:white;font:14px Arial}#view{height:80vh}button{margin:3px;padding:10px}</style></head><body><div id="view"></div><center><div id="buttons"></div><button id="reset">Reset</button></center><script type="module"> import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'; const view=document.querySelector('#view'),scene=new T.Scene(),camera=new T.PerspectiveCamera(45,1,.1,100),renderer=new T.WebGLRenderer({antialias:true}); scene.background=new T.Color(0x191c24);camera.position.z=5;renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.append(renderer.domElement); scene.add(new T.HemisphereLight(0xffffff,0x555577,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,4,5);scene.add(light); const material=new T.MeshStandardMaterial({color:0x8274f5}),geometries={Cube:()=>new T.BoxGeometry(1.7,1.7,1.7),Sphere:()=>new T.SphereGeometry(1,24,16),Cylinder:()=>new T.CylinderGeometry(.8,.8,1.8,24),Cone:()=>new T.ConeGeometry(1,1.8,24),Pyramid:()=>new T.ConeGeometry(1,1.8,4)};let shape; function select(name){if(shape){scene.remove(shape);shape.geometry.dispose()}shape=new T.Mesh(geometries[name](),material);shape.rotation.set(.3,.5,0);scene.add(shape);document.querySelectorAll('[data-shape]').forEach(b=>b.style.background=b.textContent===name?'#6554db':'')} for(const name in geometries){const b=document.createElement('button');b.textContent=name;b.dataset.shape='';b.onclick=()=>select(name);document.querySelector('#buttons').append(b)} document.querySelector('#reset').onclick=()=>shape.rotation.set(0,0,0); let drag=false,x=0,y=0;view.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;view.setPointerCapture(e.pointerId)};view.onpointerup=view.onpointercancel=()=>drag=false;view.onpointermove=e=>{if(drag){shape.rotation.y+=(e.clientX-x)*.01;shape.rotation.x+=(e.clientY-y)*.01;x=e.clientX;y=e.clientY}}; function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}window.onresize=resize;resize();select('Cube');(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)})(); </script></body></html>
